# Painel CrowdSec: só o dashboard (nginx servindo uma página estática).
# Subir:  docker compose up -d      Porta: variável PORT no arquivo .env (padrão 8083)
services:
  painel:
    image: nginx:alpine
    container_name: painel-crowdsec
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
