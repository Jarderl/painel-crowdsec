<title id="t">Painel CrowdSec: caminho dos dados</title>
<desc id="d">Os logs do Nginx Proxy Manager são lidos pelo CrowdSec. O script atualizar.sh gera arquivos JSON, que o nginx em Docker serve para o navegador, onde o painel mostra alertas, domínios atacados e bloqueios.</desc>
